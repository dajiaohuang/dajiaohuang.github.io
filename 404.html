<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f2f6f8">
    <title>页面未找到 / Not found — Wu Shuwen</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <style>
      .not-found { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
      .not-found-inner { width: min(100%, 720px); border-top: 6px solid var(--blue); padding-top: 2rem; }
      .not-found-code { color: var(--blue); font: 700 clamp(5rem, 20vw, 12rem)/.8 var(--mono); letter-spacing: -.08em; }
      .not-found h1 { margin: 2rem 0 1rem; font-size: clamp(2.5rem, 7vw, 5rem); }
      .not-found p { max-width: 34rem; color: var(--muted); font-size: 1.1rem; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div class="not-found-inner">
        <div class="not-found-code" aria-hidden="true">404</div>
        <h1>这条路径到这里结束。</h1>
        <p>页面可能已经移动，但个人主页仍然可用。<br><span lang="en">The page may have moved, but the personal index is still available.</span></p>
        <a class="button button-primary" href="/">返回主页 / Back home <span aria-hidden="true">↗</span></a>
      </div>
    </main>
  </body>
</html>
